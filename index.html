<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Place Value Safari</title><style>
:root{font-family:'Trebuchet MS',Arial,sans-serif;color:#234233;background:#f5f9e9}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#c8ecf4 0 220px,#f5f9e9 220px)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:4px solid #e6a734;outline-offset:3px}.top{background:#176b55;color:white;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{font-size:1.2rem;font-weight:900}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{border:2px solid #d6edb0;background:#fff;color:#225641;border-radius:22px;padding:9px 14px;font-weight:800}.pill.active{background:#f6d56b}.hero{text-align:center;padding:30px 14px 24px;background:linear-gradient(155deg,#9bdfeb,#d7f4e8 60%,#b6d979);position:relative;overflow:hidden}.hero:before,.hero:after{content:'🌴';position:absolute;font-size:5rem;bottom:-16px}.hero:before{left:1%}.hero:after{right:1%}.hero h1{font-size:clamp(2rem,6vw,3.7rem);margin:4px 0;color:#1a624b;text-shadow:2px 3px #f6e7a4}.hero p{font-size:1.1rem;font-weight:bold;margin:8px}.wrap{max-width:1060px;margin:auto;padding:18px 16px 50px}.panel{background:white;border:3px solid #d4e6bb;border-radius:22px;padding:22px;box-shadow:0 7px 0 #d7e5c6;margin-bottom:18px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.gamecard{border:3px solid #b7d69a;background:#fff;border-radius:22px;text-align:left;overflow:hidden;box-shadow:0 7px 0 #d5e3c5;padding:0;transition:transform .12s}.gamecard:hover{transform:translateY(-3px)}.cardart{display:grid;place-items:center;height:115px;font-size:4.3rem;background:linear-gradient(120deg,#c5e9ad,#fceca3)}.cardtext{padding:16px}.cardtext strong{font-size:1.25rem;color:#215d45}.cardtext p{margin:6px 0;color:#51644b}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}.action{border:0;border-radius:14px;padding:12px 20px;background:#247c59;color:white;font-weight:900;min-height:48px}.action.secondary{background:#e6f1cf;color:#235a42}.action:disabled{opacity:.45;cursor:not-allowed}.sectiontitle{margin:0 0 12px;font-size:1.6rem}.muted{color:#5b6c5c}.sequence{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:22px 0}.number{min-width:65px;padding:16px 12px;border:3px solid #b6d59a;border-radius:15px;text-align:center;background:#f2f8e6;font-size:1.35rem;font-weight:900}.number.missing{background:#fff0bd;border-color:#e9ad3f}.number.bad{background:#ffe1d5;border-color:#dc845a}.number.pick{cursor:pointer}.number.selected{outline:4px solid #3482ad}.keypad{max-width:320px;margin:15px auto}.display{border:3px solid #9dbf7e;border-radius:14px;background:#f5fae8;padding:12px;text-align:center;min-height:62px;font-size:2rem;font-weight:900;letter-spacing:2px}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}.key{min-height:57px;border:2px solid #b7d3a0;background:#fff;border-radius:13px;font-size:1.5rem;font-weight:900;color:#275a43}.key:active{background:#f4e1a3}.feedback{border-radius:14px;padding:14px;font-weight:800;background:#eaf4d7;margin-top:12px}.feedback.wrong{background:#fff0d9}.blocks{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-end;margin:15px 0}.blockgroup{text-align:center;min-width:95px}.blockgroup small{display:block;margin-top:7px;font-weight:900}.blockicons{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:220px;margin:auto}.hundred{width:25px;height:25px;background:repeating-linear-gradient(0deg,transparent 0 5px,#ad7834 5px 6px),repeating-linear-gradient(90deg,#f6c46b 0 5px,#ad7834 5px 6px);border:1px solid #ad7834}.ten{width:9px;height:46px;background:repeating-linear-gradient(0deg,#79c3cf 0 4px,#348a9a 4px 5px);border:1px solid #348a9a}.one{width:11px;height:11px;background:#e99b70;border:1px solid #a55b37}.chart{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;margin:16px auto;max-width:750px}.cell{border:1px solid #b8d1a4;border-radius:5px;padding:9px 1px;text-align:center;font-weight:800;font-size:clamp(.7rem,2vw,1rem);background:#f1f8e7}.cell.start{background:#f8d475}.cell.target{background:#8bceb8}.cell.path{background:#d8eec0}.options{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.toggle{padding:10px 15px;border-radius:20px;border:2px solid #9ebf82;background:#fff;font-weight:800}.toggle.on{background:#d3efaa;border-color:#3f8b53}.toggle:disabled{opacity:.4}.hidden{display:none!important}.small{font-size:.9rem}.stars{font-weight:900;color:#ffdf71}.settings{max-width:690px;margin:auto}.settings h2{margin-top:0}.footer{text-align:center;padding:20px;color:#5c745b;font-size:.85rem}@media(max-width:600px){.cards{grid-template-columns:1fr}.hero:before,.hero:after{font-size:3rem}.panel{padding:15px}.number{min-width:54px;padding:13px 8px}.cell{padding:7px 0}.top{justify-content:center}}

.speak{border:2px solid #b3d1a0;background:#fff;border-radius:13px;padding:10px 14px;font-weight:900;color:#205e49}
.compare{display:grid;grid-template-columns:minmax(0,1fr) 60px minmax(0,1fr);gap:10px;align-items:center;margin:20px 0}
.comparebox{border:3px solid #b7d69a;border-radius:17px;background:#f4f9e8;padding:16px 8px;text-align:center;min-height:110px;display:grid;place-items:center}
.comparebox strong{font-size:clamp(1.5rem,5vw,2.5rem)}.symbols{display:flex;gap:12px;justify-content:center;margin:15px 0}.symbol{font-size:2.3rem;min-width:80px;min-height:72px;border:3px solid #91b77c;border-radius:15px;background:#fff;color:#245b43;font-weight:900}.symbol.selected{background:#f9df88;border-color:#e1a733}
.rep{font-weight:900;font-size:clamp(1rem,2.7vw,1.3rem);overflow-wrap:anywhere}.rep small{display:block;font-size:.82rem;font-weight:600;margin-bottom:8px}
.rep .blocks{gap:5px}.rep .blockgroup{min-width:54px}.rep .blockicons{max-width:110px}.rep .hundred{width:17px;height:17px}.rep .ten{height:29px;width:7px}.rep .one{width:8px;height:8px}
.questionhead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
@media(max-width:500px){.symbol{min-width:66px}.compare{grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr);gap:5px}.comparebox{padding:9px 3px}.rep .blockgroup{min-width:38px}}
</style></head>
<body>
<header class="top"><div class="brand">🦁 <span data-i="title">Place Value Safari</span></div>
<div class="tools"><span class="stars">⭐ <span id="stars">0</span></span><button class="pill" id="langBtn">Español</button></div></header>
<section class="hero"><div style="font-size:2.8rem">🦒 🐘 🦓</div><h1 data-i="title">Place Value Safari</h1><p data-i="tagline">Explore numbers, discover patterns, earn stars!</p></section>
<main class="wrap">
<section id="home"><div class="panel"><h2 class="sectiontitle" data-i="choose">Choose your safari adventure!</h2><p class="muted" data-i="homeinfo">Skip count by 5, 10, 25 and 100, or compare numbers to 1,000!</p><div class="cards" id="cards"></div></div></section>
<section id="game" class="hidden"><div class="row between" style="margin-bottom:14px"><button class="action secondary" id="back">🏠 <span data-i="home">Home</span></button><span class="pill" id="skillLabel"></span></div>
<div class="panel"><div class="questionhead"><h2 class="sectiontitle" id="gameTitle"></h2><button class="speak" id="speakBtn">🔊 <span data-i="listen">Listen</span></button></div>
<p class="muted" id="instruction"></p><div id="gameContent"></div><div id="feedback" aria-live="polite"></div>
<div class="row" id="gameActions" style="margin-top:16px"><button class="action secondary" id="hintBtn" data-i="hint">💡 Hint</button><button class="action" id="nextBtn" style="display:none" data-i="nextQuestion">Next Question ➜</button></div></div></section>
</main><div class="footer">🌿 <span data-i="footer">Keep exploring, mathematician!</span> 🌿</div>
<script>
const tr={
en:{title:"Place Value Safari",teacher:"Teacher Settings",tagline:"Explore numbers, discover patterns, earn stars!",choose:"Choose your safari adventure!",homeinfo:"Discover number patterns or compare numbers to 1,000!",home:"Home",hint:"💡 Hint",new:"New Question ↻",nextQuestion:"Next Question ➜",listen:"Listen",settingsIntro:"Choose which skip-counting skills students practice. Settings stay on this device.",settingNote:"Comparing games remain available. At least one counting skill must stay enabled.",save:"Save & Return Home",privacy:"Stars and settings are saved in this browser. No student accounts.",footer:"Keep exploring, mathematician!",trail:"Missing Number Trail",trailDesc:"Fill in missing numbers in a pattern.",chart:"Number Chart Explorer",chartDesc:"Make jumps and discover counting patterns.",gator:"Greater Gator",gatorDesc:"Compare two numbers using >, < or =.",showdown:"Safari Showdown",showdownDesc:"Compare numbers shown in different ways.",by:"Count by",forward:"forward",backward:"backward",complete:"Enter the missing number.",start:"Start at",jump:"Make one jump",enter:"Enter the number you land on.",compare:"Choose the symbol that makes the comparison true.",check:"Check Answer",correct:"Amazing! You earned a star! ⭐",wrong:"Not quite! Try again or use a hint!",need:"Enter a number first.",pickSymbol:"Choose a comparison symbol first.",hintText:"Each jump changes by",hintPlace:"Think about the hundreds, tens, and ones.",chartNote:"Yellow is the starting number. Green shows the landing number after a correct answer.",chartWindow:"Number chart",hundreds:"Hundreds",tens:"Tens",ones:"Ones",plus:"add",minus:"subtract",greater:"greater than",less:"less than",equal:"equal to",normal:"Standard form",expanded:"Expanded form",words:"Place-value clues",model:"Base-ten blocks",counting:"Skip counting",comparing:"Comparing numbers",speechUnavailable:"Read-aloud is unavailable in this browser. Try Chrome with audio turned on.",speechTip:"English read-aloud uses your device's voice.",done:"Safari Complete!",doneMsg:"You finished 10 questions! Great exploring!",returnHome:"🏠 Return Home",progress:"Question",patternHint:"Look at how the numbers change from one to the next. Use the same jump.",retry:"Try another!",typeAnswer:"Your answer"},
es:{title:"Safari del valor posicional",teacher:"Opciones del maestro",tagline:"¡Explora números, descubre patrones y gana estrellas!",choose:"¡Elige tu aventura de safari!",homeinfo:"¡Descubre patrones numéricos o compara números hasta 1,000!",home:"Inicio",hint:"💡 Pista",new:"Nueva pregunta ↻",nextQuestion:"Siguiente pregunta ➜",listen:"Escuchar",settingsIntro:"Elige los patrones que practicarán los estudiantes. Las opciones se guardan en este dispositivo.",settingNote:"Los juegos de comparación siempre están disponibles. Debe quedar al menos un patrón.",save:"Guardar y volver al inicio",privacy:"Las estrellas y opciones se guardan en este navegador. No se necesitan cuentas.",footer:"¡Sigue explorando, matemático!",trail:"Sendero de números",trailDesc:"Completa los números que faltan.",chart:"Explorador de tablas",chartDesc:"Da saltos y descubre patrones.",gator:"Cocodrilo comparador",gatorDesc:"Compara números usando >, < o =.",showdown:"Desafío del safari",showdownDesc:"Compara números representados de distintas maneras.",by:"Cuenta de",forward:"hacia adelante",backward:"hacia atrás",complete:"Escribe el número que falta.",start:"Empieza en",jump:"Da un salto",enter:"Escribe el número al que llegas.",compare:"Elige el símbolo que hace verdadera la comparación.",check:"Comprobar",correct:"¡Excelente! ¡Ganaste una estrella! ⭐",wrong:"¡Casi! Inténtalo de nuevo o pide una pista.",need:"Primero escribe un número.",pickSymbol:"Primero elige un símbolo.",hintText:"Cada salto cambia en",hintPlace:"Piensa en las centenas, decenas y unidades.",chartNote:"El amarillo es el inicio. El verde muestra la llegada después de acertar.",chartWindow:"Tabla de números",hundreds:"Centenas",tens:"Decenas",ones:"Unidades",plus:"sumar",minus:"restar",greater:"mayor que",less:"menor que",equal:"igual a",normal:"Forma estándar",expanded:"Forma desarrollada",words:"Pistas de valor posicional",model:"Bloques de base diez",counting:"Conteo por saltos",comparing:"Comparación de números",speechUnavailable:"La lectura en voz alta no está disponible en este navegador. Prueba Chrome con el sonido activado.",speechTip:"La lectura en inglés utiliza la voz del dispositivo.",done:"¡Safari completado!",doneMsg:"¡Terminaste 10 preguntas! ¡Buen trabajo!",returnHome:"🏠 Volver al inicio",progress:"Pregunta",patternHint:"Observa cómo cambian los números de uno al siguiente. Repite el mismo salto.",retry:"¡Otro reto!",typeAnswer:"Tu respuesta"}};
const games=[["trail","🐾"],["chart","🗺️"],["gator","🐊"],["showdown","🦁"]];
const $=id=>document.getElementById(id), t=k=>tr[lang][k]||k;
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[rand(0,a.length-1)];
let saved={};try{saved=JSON.parse(localStorage.getItem("placeSafariPrefs")||"{}")}catch(e){}
let lang=saved.lang==="es"?"es":"en",skills=[5,10,25,100];
let stars=Number(localStorage.getItem("placeSafariStars")||0),active=null,q=null,typed="",symbol="",answered=false,hintUsed=false,questionNumber=1;
function store(){try{localStorage.setItem("placeSafariPrefs",JSON.stringify({lang}));localStorage.setItem("placeSafariStars",stars)}catch(e){}}
function screen(id){["home","game"].forEach(s=>$(s).classList.toggle("hidden",s!==id));window.scrollTo(0,0)}
function refresh(){document.documentElement.lang=lang;document.querySelectorAll("[data-i]").forEach(el=>el.textContent=t(el.dataset.i));$("langBtn").textContent=lang==="en"?"Español":"English";$("stars").textContent=stars;renderHome();if(active&&q)renderQuestion()}
function renderHome(){$("cards").innerHTML=games.map(([id,emoji])=>`<button class="gamecard" data-game="${id}"><div class="cardart">${emoji}</div><div class="cardtext"><strong>${t(id)}</strong><p>${t(id+"Desc")}</p></div></button>`).join("");document.querySelectorAll("[data-game]").forEach(b=>b.onclick=()=>start(b.dataset.game))}
function start(id){active=id;questionNumber=1;screen("game");next()}
function newQuestion(){if(active==="trail"||active==="chart"){const step=pick(skills),dir=Math.random()<.25?-1:1;
if(active==="trail"){const start=rand(dir===1?0:step*4,dir===1?1000-step*4:1000);const nums=Array.from({length:5},(_,i)=>start+i*step*dir);const missing=rand(1,3);return{step,dir,nums,missing,answer:nums[missing]}}
const start=rand(dir===1?0:step*3,dir===1?1000-step*3:1000);return{step,dir,start,nums:[start,start+dir*step,start+dir*step*2],answer:start+dir*step*3}}
if(active==="gator"){let a=rand(0,1000),b=rand(0,1000);if(Math.random()<.2)b=a;else if(Math.random()<.5){b=Math.max(0,Math.min(1000,a+pick([-100,-10,-1,1,10,100])))}return{a,b,answer:a>b?">":a<b?"<":"="}}
let a=rand(100,999),b=rand(100,999);if(Math.random()<.17)b=a;else if(Math.random()<.45)b=Math.max(0,Math.min(1000,a+pick([-100,-10,-1,1,10,100])));
let forms=["normal","expanded","words","model"];let formA=pick(forms),formB=pick(forms.filter(x=>x!==formA));return{a,b,formA,formB,answer:a>b?">":a<b?"<":"="}}
function next(){$("speakBtn").style.display="";q=newQuestion();typed="";symbol="";answered=false;hintUsed=false;$("feedback").innerHTML="";$("gameActions").style.display="flex";$("hintBtn").style.display="";$("nextBtn").style.display="none";renderQuestion()}
function keypad(){return `<div class="keypad"><div class="display" id="answerDisplay" aria-live="polite">${typed||"?"}</div><div class="keys">${["1","2","3","4","5","6","7","8","9","⌫","0","C"].map(k=>`<button class="key" data-key="${k}" aria-label="${k==="⌫"?"Backspace":k==="C"?"Clear":k}">${k}</button>`).join("")}</div><button class="action" style="width:100%" id="checkBtn">${t("check")}</button></div>`}
function symbols(){return `<div class="symbols">${[">","<","="].map(s=>`<button class="symbol ${symbol===s?"selected":""}" data-symbol="${s}" aria-pressed="${symbol===s}">${s===" <"?"&lt;":s.replace("<","&lt;")}</button>`).join("")}</div><div style="text-align:center"><button class="action" id="checkBtn">${t("check")}</button></div>`}
function blocks(n){let h=Math.floor(n/100),te=Math.floor(n%100/10),o=n%10;return `<div class="blocks">${[[h,"hundreds","hundred"],[te,"tens","ten"],[o,"ones","one"]].map(([count,label,cls])=>`<div class="blockgroup"><div class="blockicons">${Array.from({length:count},()=>`<span class="${cls}"></span>`).join("")||"—"}</div><small>${count} ${t(label)}</small></div>`).join("")}</div>`}
function representation(n,form){let h=Math.floor(n/100),te=Math.floor(n%100/10),o=n%10;if(form==="normal")return `<div class="rep"><small>${t("normal")}</small><strong>${n}</strong></div>`;if(form==="expanded")return `<div class="rep"><small>${t("expanded")}</small>${[h*100,te*10,o].filter(x=>x>0).join(" + ")||"0"}</div>`;if(form==="words")return `<div class="rep"><small>${t("words")}</small>${h} ${t("hundreds").toLowerCase()}, ${te} ${t("tens").toLowerCase()}, ${o} ${t("ones").toLowerCase()}</div>`;return `<div class="rep"><small>${t("model")}</small>${blocks(n)}</div>`}
function chart(){let lower=Math.floor(Math.min(...q.nums,q.answer)/100)*100;if(Math.max(...q.nums,q.answer)>lower+99)lower=Math.max(...q.nums,q.answer)-99;lower=Math.max(0,Math.min(901,lower));return `<p class="small muted">${t("chartWindow")}: ${lower}–${lower+99}</p><div class="chart">${Array.from({length:100},(_,i)=>{let n=lower+i;return `<div class="cell ${q.nums.includes(n)?"start":""} ${answered&&n===q.answer?"target":""}">${n}</div>`}).join("")}</div><p class="small muted">${t("chartNote")}</p>`}
function englishInstruction(){if(active==="trail")return `Find the pattern. What is the missing number?`;if(active==="chart")return `Look at the number pattern on the chart. What number comes next?`;return active==="gator"?`Compare ${q.a} and ${q.b}. Which symbol makes the comparison true?`:"Compare the two numbers shown in different ways. Which symbol makes the comparison true?"}
function renderQuestion(){if(!q)return;$("skillLabel").textContent=`${t("progress")} ${questionNumber} / 10`;$("gameTitle").textContent=t(active);
let instruction="",content="";if(active==="trail"){instruction=t("complete");content=`<div class="sequence">${q.nums.map((n,i)=>`<div class="number ${i===q.missing?"missing":""}">${i===q.missing?"?":n}</div>`).join("")}</div>`+keypad()}
else if(active==="chart"){instruction=lang==="en"?"Find the pattern. What number comes next?":"Encuentra el patrón. ¿Qué número sigue?";content=`<div class="sequence">${q.nums.map(n=>`<div class="number">${n}</div>`).join("")}<div class="number missing">?</div></div>`+chart()+keypad()}
else{instruction=t("compare");content=`<div class="compare"><div class="comparebox">${active==="gator"?`<strong>${q.a}</strong>`:representation(q.a,q.formA)}</div><div style="text-align:center;font-size:2rem;font-weight:900">?</div><div class="comparebox">${active==="gator"?`<strong>${q.b}</strong>`:representation(q.b,q.formB)}</div></div>`+symbols()}
$("instruction").textContent=instruction;$("gameContent").innerHTML=content;
document.querySelectorAll("[data-key]").forEach(b=>b.onclick=()=>{let k=b.dataset.key;typed=k==="C"?"":k==="⌫"?typed.slice(0,-1):typed.length<4?typed+k:typed;$("answerDisplay").textContent=typed||"?"});
document.querySelectorAll("[data-symbol]").forEach(b=>b.onclick=()=>{symbol=b.dataset.symbol;document.querySelectorAll("[data-symbol]").forEach(el=>{el.classList.toggle("selected",el.dataset.symbol===symbol);el.setAttribute("aria-pressed",String(el.dataset.symbol===symbol))})});$("checkBtn").onclick=check}
function feedback(msg,wrong){$("feedback").innerHTML=`<div class="feedback ${wrong?"wrong":""}">${msg}</div>`}
function check(){if(answered)return;let compare=active==="gator"||active==="showdown";if(compare&&!symbol)return feedback(t("pickSymbol"),true);if(!compare&&!typed)return feedback(t("need"),true);let correct=compare?symbol===q.answer:Number(typed)===q.answer;if(correct){answered=true;stars++;store();$("stars").textContent=stars;feedback(t("correct"),false);$("hintBtn").style.display="none";$("nextBtn").style.display="";$("nextBtn").textContent=questionNumber===10?t("done")+" 🏆":t("nextQuestion");if(active==="chart")renderQuestion()}else feedback(t("wrong"),true)}
function finishGame(){q=null;$("skillLabel").textContent="10 / 10";$("gameTitle").textContent=t("done");$("instruction").textContent="";$("gameContent").innerHTML=`<div style="text-align:center;padding:26px 8px"><div style="font-size:5rem">🏆🌟🦁</div><h2>${t("doneMsg")}</h2><button class="action" id="finishHome">${t("returnHome")}</button></div>`;$("feedback").innerHTML="";$("gameActions").style.display="none";$("speakBtn").style.display="none";$("finishHome").onclick=()=>{active=null;screen("home")}}
function hint(){hintUsed=true;if(active==="trail"||active==="chart"){feedback(t("patternHint"),false)}else{const a=q.a,b=q.b;let msg=lang==="en"?"Compare the hundreds first. If they match, compare tens, then ones.":"Compara primero las centenas. Si son iguales, compara las decenas y luego las unidades.";feedback(msg,false)}}
function speak(){if(!("speechSynthesis" in window)){feedback(t("speechUnavailable"),true);return}try{speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(englishInstruction());utter.lang="en-US";utter.rate=.88;utter.pitch=1.06;const voices=speechSynthesis.getVoices();const english=voices.filter(v=>/^en[-_]/i.test(v.lang));const natural=english.find(v=>/natural|enhanced|premium|google us english|samantha|aria|jenny/i.test(v.name));if(natural)utter.voice=natural;else if(english.length)utter.voice=english[0];speechSynthesis.speak(utter)}catch(e){feedback(t("speechUnavailable"),true)}}
$("langBtn").onclick=()=>{lang=lang==="en"?"es":"en";store();refresh()};$("back").onclick=()=>{if("speechSynthesis" in window)speechSynthesis.cancel();active=null;screen("home")};$("nextBtn").onclick=()=>{if(!answered)return;if("speechSynthesis" in window)speechSynthesis.cancel();if(questionNumber===10){finishGame()}else{questionNumber++;next()}};$("hintBtn").onclick=hint;$("speakBtn").onclick=speak;
document.addEventListener("keydown",e=>{if($("game").classList.contains("hidden")||e.target.tagName==="BUTTON"||active==="gator"||active==="showdown")return;if(/^\d$/.test(e.key)&&typed.length<4){typed+=e.key;let d=$("answerDisplay");if(d)d.textContent=typed}else if(e.key==="Backspace"){typed=typed.slice(0,-1);let d=$("answerDisplay");if(d)d.textContent=typed||"?"}else if(e.key==="Enter")check()});
refresh();
</script></body></html>
